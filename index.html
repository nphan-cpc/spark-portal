<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark - Team Server</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 48px 40px;
      width: 380px;
      text-align: center;
    }
    .logo { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; color: #ffffff; }
    .logo span { color: #f97316; }
    .subtitle { font-size: 13px; color: #666; margin-bottom: 32px; }
    label { display: block; text-align: left; font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #f97316; }
    input.invalid { border-color: #ef4444; }
    button {
      width: 100%;
      padding: 12px;
      background: #f97316;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button:hover:not(:disabled) { background: #ea6c0a; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .spinner {
      width: 15px; height: 15px;
      border: 2px solid #ffffff44;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { font-size: 13px; color: #ef4444; margin-top: 12px; min-height: 18px; text-align: left; }
    .returning { margin-top: 20px; padding-top: 20px; border-top: 1px solid #2a2a2a; font-size: 13px; color: #555; }
    .returning a { color: #f97316; text-decoration: none; font-weight: 500; }
    .returning a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">&#9889; <span>Spark</span></div>
    <div class="subtitle">Team Server - Claude Code</div>

    <form id="form">
      <label for="username">Your username</label>
      <input type="text" id="username" placeholder="username"
        autocomplete="off" autocapitalize="off" spellcheck="false" autofocus maxlength="32">
      <button type="submit" id="btn">
        <div class="spinner" id="spinner"></div>
        <span id="btn-text">Open my terminal</span>
      </button>
      <div class="error" id="error"></div>
    </form>

    <div class="returning" id="returning" style="display:none">
      Welcome back - <a href="#" id="returning-link"></a>
    </div>
  </div>

  <script>
    var SERVER = "https://constitutes-reid-few-kennedy.trycloudflare.com";

    var input   = document.getElementById("username");
    var btn     = document.getElementById("btn");
    var btnText = document.getElementById("btn-text");
    var spinner = document.getElementById("spinner");
    var errorEl = document.getElementById("error");

    var saved = localStorage.getItem("spark_username");
    if (saved) {
      var ret  = document.getElementById("returning");
      var link = document.getElementById("returning-link");
      ret.style.display = "block";
      link.textContent = "Continue as " + saved;
      link.addEventListener("click", function(e) { e.preventDefault(); go(saved); });
    }

    input.addEventListener("input", function() {
      this.value = this.value.replace(/[^a-zA-Z0-9_-]/g, "");
      errorEl.textContent = "";
      input.classList.remove("invalid");
    });

    document.getElementById("form").addEventListener("submit", function(e) {
      e.preventDefault();
      var username = input.value.trim().toLowerCase();
      if (!username) { return showError("Please enter your username."); }
      if (username.length < 2) { return showError("Username must be at least 2 characters."); }
      go(username);
    });

    function go(username) {
      setLoading(true);
      errorEl.textContent = "";
      input.classList.remove("invalid");

      fetch(SERVER + "/api/check-user?u=" + encodeURIComponent(username))
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.exists) {
            localStorage.setItem("spark_username", username);
            window.location.href = SERVER + "/" + username + "/";
          } else {
            setLoading(false);
            showError("Username not found. Contact your admin.");
          }
        })
        .catch(function() {
          setLoading(false);
          showError("Could not reach the server. Please try again.");
        });
    }

    function setLoading(on) {
      btn.disabled = on;
      spinner.style.display = on ? "block" : "none";
      btnText.textContent = on ? "Checking..." : "Open my terminal";
    }

    function showError(msg) {
      errorEl.textContent = msg;
      input.classList.add("invalid");
      input.focus();
    }
  </script>
</body>
</html>
